[project]
name = "llm-gateway"
version = "0.1.0"
description = "LLM Gateway — proxy, accounting, and admin for OpenAI-compatible upstreams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "greenlet>=3.5.1",
    "httpx2>=2.5.0",
    "mcp>=1.28.1",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "redis>=7.4.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.47.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Project-wide ignores — each is a deliberate decision, not a suppression:
#   E501  line length — handled by the formatter (line-length above)
#   B008  Depends()/Query()/Header() in default args — FastAPI idiom,
#         ruff's own docs recommend ignoring this for FastAPI projects
#   B904  raise inside except without `from` — pre-existing pattern across
#         the codebase; tracked for incremental cleanup, not blocking
#   E712  `== True/False` — used legitimately inside SQLAlchemy case() /
#         column expressions where `is_()` is the alternative
ignore = ["E501", "B008", "B904", "E712"]

[tool.ruff.lint.per-file-ignores]
# Lazy `from x import y` inside functions is used throughout to break
# circular-import cycles (security <-> policy <-> rate_limit). This is a
# deliberate pattern, not a mistake.
"src/llm_gateway/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6.0",
]
