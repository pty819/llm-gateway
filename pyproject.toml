[project]
name = "llm-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "greenlet>=3.5.1",
    "httpx2>=2.5.0",
    "litellm>=1.86.0",
	# mcp 2.0 removed the bundled FastMCP server this module builds on
	# (mcp.server.fastmcp); migrating to the standalone fastmcp package is
	# tracked separately. Stay on 1.x until then.
	"mcp>=1.28.1,<2",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "redis>=7.4.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.47.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
